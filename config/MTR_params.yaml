auto_calibration: false  # true=automatic drive-to-stop; false=manual calibration
collision_avoidance: false  # true=predictive hitbox avoidance; false=horizontal end-effector X avoidance
collision_log_only: false  # true=compute and print avoidance torques but never apply them
collision_prediction_horizon: 0.15  # Constant-velocity prediction horizon [s]
collision_influence_distance: 0.15  # Hitbox clearance or horizontal EE X separation [m]
collision_spring_gain: 2  # Exponential spring gain [N]
collision_decay_length: 0.05  # Exponential spring length scale [m]
collision_damping_gain: 2.0  # Closing-speed damping gain [N*s/m]
midline_influence_distance: 0.08  # Mirror mode: leader is pushed back within this of the midline x=0 [m]
midline_spring_gain: 1.0  # Mirror-mode midline exponential spring gain [N] (~13 N at the line)
midline_decay_length: 0.03  # Mirror-mode midline spring length scale [m]
midline_damping_gain: 30  # Mirror-mode midline closing-speed damping [N*s/m]
controller_stiffness: 100  # Spring K for hold/mimic/mirror/parked arm [N/m]; 20 N cap reached at 20/K m error
controller_damping: 20  # Damping D for the same controllers [N*s/m]
align_speed: 0.05  # Max speed the target moves into a mimic/mirror/parked reference on entry [m/s]
park_stiffness: 20  # Unused arm's hold in one-arm operation: joint spring towards qCalibration [N*m/rad]
park_damping: 1.0  # Unused arm's hold joint damping [N*m*s/rad] (0 = spring only)
park_max_torque: 4  # Unused arm's hold torque cap per joint [N*m]
park_speed: 10  # Speed the hold target moves to qCalibration [deg/s]

v1_unit:
  task_origin: [-0.26, -0.067]  # Shared task-frame origin (centre between shoulders) seen from this shoulder, local axes [m]
  task_mirror_x: true  # Mirror-image arm: local x points the opposite way in the shared frame (+y = arm reach for both)
  task_yaw: 0  # Rotation of this robot's local axes into the shared task frame [deg]
  drive_node_ids: [2, 3]  # Joint 0 and joint 1 CANopen node IDs
  L1: 0.43  # Proximal link length [m]
  L2: 0.37  # Distal link length [m]
  parallel_ratio: 1.0  # Parallel linkage ratio
  dqMax: 200  # Maximum joint speed [deg/s]
  tauMax: 30  # Maximum commanded joint torque [N*m]
  tauSafetyMax: 30  # Measured joint torque stop threshold [N*m]
  qDampingWidth: 10.0  # Joint-limit damping band [deg]
  qDampingGain: 0.0  # Joint-limit damping gain [N*m*s/rad] (same on both units)
  singularityDampingAngleExtended: 20.0  # Damping band before the extended elbow stop [deg]
  singularityDampingAngleFolded: 35.0  # Damping band before the folded elbow stop [deg]
  singularityExtendedStop: 25.0  # Elbow angle q2-q1 of the extended stop (q1=50, q2=75); full damping here [deg]
  singularityFoldedStop: 150.0  # Elbow angle q2-q1 of the folded stop (q1=-10, q2=140); full damping here [deg]
  singularityDampingGain: 0.0  # Singularity damping gain [N*m*s/rad] (same on both units)
  collision:
    link_thickness: 0.04  # Link diameter [m]
    boundary: 0.02  # Link clearance [m]
    link_A_length: 0.20  # Short parallel-link length [m]
    joint_radius: 0.06  # Joint collision radius [m]
    end_effector_radius: 0.12  # End-effector circle radius [m]; MUST VERIFY
    frame:
      center_x: 0.246  # Frame center x relative to base [m]
      center_y: 0.1175  # Frame center y relative to base [m]
      width: 0.49  # Frame width [m]
      height: 0.235  # Frame height [m]
      boundary: 0.05  # Frame clearance [m]
  iPeakDrives: [2.795, 2.795]  # Joint 0 and joint 1 peak current limits [A]
  motorCstt: [0.114, 0.114]  # Joint 0 and joint 1 motor torque constants [N*m/A]
  qSigns: [1, -1]  # Joint 0 and joint 1 direction sign corrections
  reductionRatios: [13.3, 13.3]  # Joint 0 and joint 1 gearbox ratios (motor turns per joint turn)
  encoderCounts: [8192, 8192]  # Joint 0 and joint 1 encoder counts per motor revolution (2048 lines x 4)
  calibration_direction: [-1, -1]  # Auto-calibration joint torque direction signs; MUST VERIFY
  calibration_torque: [2.6, 2.0]  # Auto-calibration joint torque magnitudes [N*m]; MUST VERIFY
  qLimits: [-12, 160, 14, 235]  # Joint 0 and joint 1 angle limits [deg]
  qCalibration: [-10, 140]  # Joint 0 and joint 1 calibration angles [deg]
  frictionVis: [0.33, 0.76]  # Joint 0 and joint 1 viscous friction [N*m*s/rad]
  frictionCoul: [0.35, 0.19]  # Joint 0 and joint 1 Coulomb friction [N*m]
  maxEndEffForce: 20.0  # Maximum end-effector force [N]

v2_unit:
  task_origin: [-0.265, -0.067]  # Shared task-frame origin (centre between shoulders) seen from this shoulder, local axes [m]
  task_mirror_x: false  # Mirror-image arm: local x points the opposite way in the shared frame
  task_yaw: 0  # Rotation of this robot's local axes into the shared task frame [deg]
  drive_node_ids: [1, 4]  # Joint 0 and joint 1 CANopen node IDs
  L1: 0.43  # Proximal link length [m]
  L2: 0.37  # Distal link length [m]
  parallel_ratio: 1.0  # Parallel linkage ratio
  dqMax: 200  # Maximum joint speed [deg/s]
  tauMax: 30  # Maximum commanded joint torque [N*m]
  tauSafetyMax: 10  # Measured joint torque stop threshold [N*m]
  qDampingWidth: 15.0  # Joint-limit damping band [deg]
  qDampingGain: 25.0  # Joint-limit damping gain [N*m*s/rad]
  singularityDampingAngleExtended: 20.0  # Damping band before the extended elbow stop [deg]
  singularityDampingAngleFolded: 35.0  # Damping band before the folded elbow stop [deg]
  singularityExtendedStop: 25.0  # Elbow angle q2-q1 of the extended stop (q1=50, q2=75); full damping here [deg]
  singularityFoldedStop: 150.0  # Elbow angle q2-q1 of the folded stop (q1=-10, q2=140); full damping here [deg]
  singularityDampingGain: 10.0  # Singularity damping gain [N*m*s/rad] (same on both units)
  collision:
    link_thickness: 0.03  # Link diameter [m]
    boundary: 0.02  # Link clearance [m]
    link_A_length: 0.195  # Short parallel-link length [m]
    joint_radius: 0.03  # Joint collision radius [m]
    end_effector_radius: 0.12  # End-effector circle radius [m]; MUST VERIFY
    frame:
      center_x: 0.246  # Frame center x relative to base [m]
      center_y: 0.1175  # Frame center y relative to base [m]
      width: 0.49  # Frame width [m]
      height: 0.235  # Frame height [m]
      boundary: 0.05  # Frame clearance [m]
  iPeakDrives: [4.091, 4.091]  # Rated (CME2 continuous) current [A]: 1000 drive units = 0x6076 (0.945 N*m) / motorCstt
  motorCstt: [0.231, 0.231]  # Joint 0 and joint 1 motor torque constants [N*m/A]
  qSigns: [-1, -1]  # Joint 0 and joint 1 direction sign corrections
  reductionRatios: [11.083, 11.083]  # Joint 0 and joint 1 gearbox ratios (motor turns per joint turn)
  encoderCounts: [16384, 16384]  # Joint 0 and joint 1 encoder counts per motor revolution (4096 lines x 4)
  calibration_direction: [-1, -1]  # Auto-calibration joint torque direction signs; MUST VERIFY
  calibration_torque: [2.6, 2.0]  # Auto-calibration joint torque magnitudes [N*m]; MUST VERIFY
  qLimits: [-17, 160, 8, 235]  # Joint 0 and joint 1 angle limits [deg]
  qCalibration: [-15.7, 140]  # Joint 0 and joint 1 calibration angles [deg]
  frictionVis: [0.33, 0.76]  # Joint 0 and joint 1 viscous friction [N*m*s/rad]
  frictionCoul: [0.35, 0.19]  # Joint 0 and joint 1 Coulomb friction [N*m]
  maxEndEffForce: 20.0  # Maximum end-effector force [N]
