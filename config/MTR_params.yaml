Robot0:
  drive_node_ids: [1]  # CANopen drive node ID
  L1: 0.43  # Proximal link length [m]
  L2: 0.37  # Distal link length [m]
  parallel_ratio: 1.0  # Parallel linkage ratio
  dqMax: 200  # Maximum joint speed [deg/s]
  tauMax: 3.0  # Maximum commanded joint torque [N*m]
  tauSafetyMax: 6.0  # Measured joint torque stop threshold [N*m]
  qDampingWidth: 10.0  # Soft-limit damping band [deg]
  qDampingGain: 0.5  # Soft-limit damping gain [N*m*s/rad]
  singularityDampingAngleExtended: 15.0  # Extended singularity damping range [deg]
  singularityDampingAngleFolded: 15.0  # Folded singularity damping range [deg]
  singularityDampingGain: 0.5  # Singularity damping gain [N*m*s/rad]
  collision:
    base_x: 0.0  # Robot base x position in shared frame [m]
    base_y: 0.0  # Robot base y position in shared frame [m]
    base_yaw: 0.0  # Robot base rotation in shared frame [deg]
    link_thickness: 0.08  # Link diameter [m]
    boundary: 0.02  # Link clearance [m]
    link_A_length: 0.20  # Short parallel-link length [m]
    joint_radius: 0.02  # Joint collision radius [m]
    frame:
      center_x: 0.0  # Frame center x relative to base [m]
      center_y: 0.0  # Frame center y relative to base [m]
      width: 0.60  # Frame width [m]
      height: 0.40  # Frame height [m]
      boundary: 0.02  # Frame clearance [m]
  iPeakDrives: [2.795]  # Drive peak current limit [A]
  motorCstt: [0.114]  # Motor torque constant [N*m/A]
  qSigns: [1]  # Joint direction sign correction
  qLimits: [-360, 360]  # Joint minimum and maximum angles [deg]
  qCalibration: [0]  # Calibration reference angle [deg]
  frictionVis: [0.33]  # Viscous friction coefficient [N*m*s/rad]
  frictionCoul: [0.35]  # Coulomb friction coefficient [N*m]
  maxEndEffForce: 20.0  # Maximum end-effector force [N]

